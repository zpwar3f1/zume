<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Zumee · 温哥华车身广告平台 · Local drivers, local businesses."><link rel="icon" href="/favicon.png" type="image/png"></head><body><title>Zumee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{--orange:#F26B1D;--orange-deep:#D95A12;--amber:#FFB347;--ink:#1B1F24;--ink-2:#4A4F55;--ink-3:#7A7F86;--cream:#FFF7EF;--paper:#FFFFFF;--sand:#F6E9DC;--line:#E9DCCF;--focus:#F26B1D;
--latin:'Sora','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;--sans:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
img{max-width:100%;height:auto;display:block}
/* site chrome */
.demo-banner{margin:0;text-align:center;padding:9px 16px;background:var(--ink);color:var(--cream);font-size:13px;letter-spacing:.02em}
.demo-header{max-width:1460px;margin:auto;padding:14px 4.5vw 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.demo-header nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.demo-header nav a{font-size:14px;color:var(--ink-2);padding:6px 10px;border-radius:999px}
.demo-header nav a:hover{background:var(--sand);color:var(--ink)}
.demo-header button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);border-radius:999px;cursor:pointer}
.demo-header button.active{background:var(--orange);border-color:var(--orange);color:var(--ink);font-weight:700}
/* home */
.home{max-width:1460px;margin:auto;padding:0 4.5vw}
.nav{border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:20px;height:92px}
.logo{display:inline-flex;align-items:center}
.logo-img{height:44px;width:auto;display:block}
.nav-note{color:var(--ink-3);font-size:14px;letter-spacing:.04em}
.nav-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);padding:9px 14px;border:1.5px solid var(--ink);border-radius:999px}
.nav-link:hover{background:var(--ink);color:var(--cream)}
.intro{padding:64px 0 44px;max-width:900px}
.eyebrow{font-family:var(--latin);letter-spacing:.16em;text-transform:uppercase;color:var(--orange);margin:0 0 18px;font-size:12px;font-weight:700}
.intro h1{font-family:var(--latin);letter-spacing:-.02em;margin:0 0 18px;font-size:clamp(34px,5vw,66px);font-weight:700;line-height:1.15;text-wrap:balance}
.intro h1 span{color:var(--orange)}
.intro>p:last-child{color:var(--ink-2);font-size:18px;margin:0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.portal{border-radius:10px;display:flex;flex-direction:column;min-height:460px;padding:28px 32px 22px;transition:transform .25s,box-shadow .25s;position:relative}
.portal:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(27,31,36,.14)}
.portal-top{display:flex;justify-content:space-between;align-items:center;font-family:var(--latin);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.portal-body{flex:1;padding-top:44px}
.kicker{margin:0 0 14px;font-size:14px;font-weight:500;opacity:.85}
.portal h2{font-family:var(--latin);letter-spacing:-.02em;margin:0 0 18px;font-size:clamp(30px,3.3vw,48px);font-weight:700;line-height:1.2}
.description{margin:0 0 26px;font-size:16px;line-height:1.9}
.cta{border-radius:999px;display:inline-flex;justify-content:space-between;align-items:center;gap:28px;padding:14px 20px;font-size:15px;font-weight:700}
.portal-bottom{display:flex;justify-content:space-between;gap:12px;border-top:1px solid;padding-top:14px;margin-top:26px;font-size:13px}
.driver{background:var(--orange);color:var(--ink)}
.driver h2 span{color:var(--cream)}
.driver .cta{background:var(--ink);color:var(--cream)}
.driver .portal-bottom{border-color:rgba(27,31,36,.25)}
.business{background:var(--ink);color:var(--cream)}
.business h2 span{color:var(--orange)}
.business .description{color:#D6D1CB}
.business .cta{background:var(--orange);color:var(--ink)}
.business .portal-top{color:var(--amber)}
.business .portal-bottom{border-color:rgba(255,247,239,.22);color:#C9C3BC}
.why{padding:64px 0 8px}
.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.why-grid>div{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--orange);border-radius:10px;padding:22px 24px}
.why-grid h3{font-family:var(--latin);font-size:17px;margin:0 0 8px;font-weight:700}
.why-grid p{margin:0;color:var(--ink-2);font-size:15px;line-height:1.8}
@media (max-width:820px){.why{padding:44px 0 0}.why-grid{grid-template-columns:1fr}}

.carousel{position:relative}
.carousel .track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px}
.carousel .track::-webkit-scrollbar{display:none}
.carousel .slide{flex:0 0 min(78%,720px);scroll-snap-align:start;margin:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.carousel .slide img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
.carousel .slide figcaption{display:flex;align-items:center;gap:12px;padding:12px 16px;font-size:14px;color:var(--ink-2)}
.carousel .slide figcaption span{font-family:var(--latin);color:var(--orange);font-weight:700;font-size:12px;letter-spacing:.1em}
.car-btn{position:absolute;top:calc(50% - 40px);width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(27,31,36,.12)}
.car-btn.prev{left:-8px}.car-btn.next{right:-8px}
.car-btn:hover{background:var(--orange);border-color:var(--orange)}
.dots{display:flex;justify-content:center;gap:8px;margin-top:14px}
.dot{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer}
.dot.active{background:var(--orange);width:22px;border-radius:4px}
@media (max-width:820px){.carousel .slide{flex-basis:88%}.car-btn{display:none}}
@media (prefers-reduced-motion:reduce){.carousel .track{scroll-behavior:auto}}
.showcase{padding:72px 0 40px}
.showcase-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:24px}
.showcase-heading h2{font-family:var(--latin);font-size:clamp(26px,3vw,40px);letter-spacing:-.02em;margin:0;font-weight:700;line-height:1.2}
.showcase-heading>p{margin:0;color:var(--ink-2)}
.showcase-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.showcase-grid figure{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.showcase-grid img{width:100%;aspect-ratio:3/2;object-fit:cover}
.showcase-grid figcaption{display:flex;align-items:center;gap:12px;padding:14px 16px;font-size:14px;color:var(--ink-2)}
.showcase-grid figcaption span{font-family:var(--latin);color:var(--orange);font-weight:700;font-size:12px;letter-spacing:.1em}
.fine{color:var(--ink-3);font-size:13px;line-height:1.7;margin:16px 0 0}
.home>footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding:22px 0 40px;font-size:13px;color:var(--ink-3)}
/* info pages */
.shell{max-width:820px;margin:auto;padding:28px 4.5vw 64px}
.info-page .logo{margin-bottom:34px}
.form-heading{margin-bottom:36px}
.form-heading h1{font-family:var(--latin);font-size:clamp(28px,4vw,46px);letter-spacing:-.02em;line-height:1.2;margin:0 0 14px;font-weight:700;text-wrap:balance}
.form-heading p{color:var(--ink-2);font-size:17px;margin:0;line-height:1.8}
.participation{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:24px 26px;margin-bottom:28px}
.participation h2{font-family:var(--latin);font-size:18px;margin:0 0 18px;font-weight:700}
.participation ol{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.participation li{border-top:2px solid var(--orange);padding-top:12px}
.step-number{font-family:var(--latin);font-size:12px;letter-spacing:.14em;color:var(--orange);font-weight:700}
.participation h3{font-size:15px;margin:6px 0 6px;font-weight:700}
.participation p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.7}
.form-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:26px}
.field{display:block;margin-bottom:20px;font-size:14px;font-weight:500;color:var(--ink)}
.field input{display:block;width:100%;margin-top:8px;height:52px;padding:0 14px;font:inherit;font-size:16px;color:var(--ink);background:var(--cream);border:1px solid var(--line);border-radius:8px}
.field input::placeholder{color:var(--ink-3);opacity:1}
.field input:focus{border-color:var(--orange);background:#fff;outline:2px solid rgba(242,107,29,.25);outline-offset:0}
.field input[type=file]{height:auto;padding:12px 14px;background:var(--paper);cursor:pointer}
.field input[type=file]::file-selector-button{font:inherit;font-size:14px;margin-right:12px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--cream);color:var(--ink);cursor:pointer}
.hint{display:block;font-size:12.5px;color:var(--ink-3);margin-top:6px;font-weight:400;line-height:1.5}
.submit:disabled{opacity:.7;cursor:wait}
.vehicle-fields{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.submit{width:100%;height:54px;margin-top:6px;font:inherit;font-size:16px;font-weight:700;background:var(--orange);color:var(--ink);border:0;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.submit:hover{background:var(--orange-deep)}
.about-block{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:24px 26px;margin-bottom:18px}
.about-block h2{font-family:var(--latin);font-size:22px;margin:0 0 10px;letter-spacing:-.01em;font-weight:700;line-height:1.3}
.about-block p{margin:8px 0;color:var(--ink-2);line-height:1.85}
.terms-list section{padding:18px 0;border-top:1px solid var(--line)}
.terms-list h2{font-family:var(--latin);font-size:17px;margin:0 0 8px;font-weight:700}
.terms-list p{margin:0;color:var(--ink-2);line-height:1.85;font-size:15px}
.draft-note{margin-top:22px;padding:14px 18px;background:var(--sand);border-left:3px solid var(--orange);font-size:14px;color:var(--ink-2)}
.demo-notice{padding:80px 4.5vw;text-align:center}
.success-icon{width:64px;height:64px;border-radius:50%;background:var(--orange);color:var(--ink);font-size:30px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-bottom:18px}
.demo-notice h1{font-family:var(--latin);font-size:30px;margin:0 0 10px;font-weight:700}
.demo-notice p{color:var(--ink-2);line-height:1.9;margin:0}
.demo-notice a{display:inline-block;margin-top:24px;color:var(--orange);font-weight:700;border-bottom:2px solid var(--orange)}
@media (max-width:820px){
  .nav{height:76px}.logo-img{height:34px}.nav-note{display:none}
  .intro{padding:40px 0 28px}
  .split,.showcase-grid,.vehicle-fields{grid-template-columns:1fr}
  .portal{min-height:0;padding:24px}.portal-body{padding-top:28px}
  .participation ol{grid-template-columns:1fr}
  .showcase{padding:48px 0 32px}
}
@media (prefers-reduced-motion:reduce){.portal{transition:none}.portal:hover{transform:none}}
</style>

const pages={"zh":{"home":"<main class=\"home\"><header class=\"nav\"><a class=\"logo\" href=\"#home\" aria-label=\"Zumee\"><img class=\"logo-img\" src=\"__IMG_LOGO__\" alt=\"Zumee\"><\/a><span class=\"nav-note\">温哥华 · 车身广告平台<\/span><a class=\"nav-link\" href=\"#pay\">商家付款<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-arrow-up-right\" aria-hidden=\"true\"><path d=\"M7 7h10v10\"><\/path><path d=\"M7 17 17 7\"><\/path><\/svg><\/a><\/header><section class=\"intro\"><p class=\"eyebrow\">大温本地的车身广告平台<\/p><h1>邻居的车，<span>本地的生意。<\/span><\/h1><p>车主照常开车，顺便多一份收入；商家不用花大钱，就能让更多街坊看到你。<\/p><\/section><section class=\"split\"><a class=\"portal driver\" href=\"#driver\"><div class=\"portal-top\"><span>01 / 车主入口<\/span><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-move-up-right\" aria-hidden=\"true\"><path d=\"M13 5H19V11\"><\/path><path d=\"M19 5L5 19\"><\/path><\/svg><\/div><div class=\"portal-body\"><p class=\"kicker\">我是车主<\/p><h2>车照常开，<br/>顺便多赚一份<span>。<\/span><\/h2><p class=\"description\">上班、接娃、买菜，路线不用变。车身贴上本地商家的广告，每个月多一笔收入。<br/>每周拍张照片就行，不用装任何定位软件。<\/p><span class=\"cta\">登记我的车<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-arrow-up-right\" aria-hidden=\"true\"><path d=\"M7 7h10v10\"><\/path><path d=\"M7 17 17 7\"><\/path><\/svg><\/span><\/div><div class=\"portal-bottom\"><span>路线你定 · 时间你定<\/span><span>免费登记<\/span><\/div><\/a><a class=\"portal business\" href=\"#business\"><div class=\"portal-top\"><span>02 / 商家入口<\/span><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-move-up-right\" aria-hidden=\"true\"><path d=\"M13 5H19V11\"><\/path><path d=\"M19 5L5 19\"><\/path><\/svg><\/div><div class=\"portal-body\"><p class=\"kicker\">我是商家<\/p><h2>把你的店名，<br/>开到街上去<span>。<\/span><\/h2><p class=\"description\">帮你打广告的，是住在大温的本地车主，车每天都在街上跑。<br/>每周给你发实拍照片，广告真的在路上，看得见。<\/p><span class=\"cta\">我要投广告<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-arrow-up-right\" aria-hidden=\"true\"><path d=\"M7 7h10v10\"><\/path><path d=\"M7 17 17 7\"><\/path><\/svg><\/span><\/div><div class=\"portal-bottom\"><span>一台也接 · 按月计费<\/span><span>24 小时内回复<\/span><\/div><\/a><\/section><section class=\"why\"><div class=\"showcase-heading\"><div><p class=\"eyebrow\">为什么是本地<\/p><h2>邻居帮邻居。<\/h2><\/div><p>车主是本地人，车在全大温跑。<\/p><\/div><div class=\"why-grid\"><div><h3>车主就是街坊<\/h3><p>每一台车的车主都住在大温，登记的时候会告诉我们住哪个社区。不是外包车队，就是你身边的人。<\/p><\/div><div><h3>钱留在本地<\/h3><p>广告费大部分直接付给本地车主，而不是进了大公司的口袋。<\/p><\/div><div><h3>投了就看得见<\/h3><p>车主每周交一张带时间的实车照片，月初月末再各拍一张里程表。车有没有在跑、跑了多少，清清楚楚。<\/p><\/div><\/div><\/section><section class=\"showcase\"><div class=\"showcase-heading\"><div><p class=\"eyebrow\">车贴效果展示<\/p><h2>贴在车上，是这个样子。<\/h2><\/div><p>不夸张、不扎眼，但走到哪儿都有人看。<\/p><\/div><div class=\"carousel\" data-carousel><div class=\"track\"><figure class=\"slide\"><img src=\"/images/showcase-1.webp\" alt=\"房产经纪\" loading=\"lazy\"/><figcaption><span>01<\/span>房产经纪<\/figcaption><\/figure><figure class=\"slide\"><img src=\"/images/showcase-2.webp\" alt=\"牙科诊所\" loading=\"lazy\"/><figcaption><span>02<\/span>牙科诊所<\/figcaption><\/figure><figure class=\"slide\"><img src=\"/images/showcase-3.webp\" alt=\"面包店\" loading=\"lazy\"/><figcaption><span>03<\/span>面包店<\/figcaption><\/figure><figure class=\"slide\"><img src=\"/images/showcase-4.webp\" alt=\"花店\" loading=\"lazy\"/><figcaption><span>04<\/span>花店<\/figcaption><\/figure><figure class=\"slide\"><img src=\"/images/showcase-5.webp\" alt=\"生鲜超市\" loading=\"lazy\"/><figcaption><span>05<\/span>生鲜超市<\/figcaption><\/figure><figure class=\"slide\"><img src=\"/images/showcase-6.webp\" alt=\"地板与家装\" loading=\"lazy\"/><figcaption><span>06<\/span>地板与家装<\/figcaption><\/figure><\/div><button type=\"button\" class=\"car-btn prev\" aria-label=\"上一张\">‹<\/button><button type=\"button\" class=\"car-btn next\" aria-label=\"下一张\">›<\/button><div class=\"dots\"><button type=\"button\" class=\"dot\" data-i=\"0\" aria-label=\"1\"><\/button><button type=\"button\" class=\"dot\" data-i=\"1\" aria-label=\"2\"><\/button><button type=\"button\" class=\"dot\" data-i=\"2\" aria-label=\"3\"><\/button><button type=\"button\" class=\"dot\" data-i=\"3\" aria-label=\"4\"><\/button><button type=\"button\" class=\"dot\" data-i=\"4\" aria-label=\"5\"><\/button><button type=\"button\" class=\"dot\" data-i=\"5\" aria-label=\"6\"><\/button><\/div><\/div><p class=\"fine\">以上都是效果图。实际车贴的大小、设计和位置以确认的方案为准，实物可能和图片有出入。<\/p><\/section><footer><span>© 2026 Zumee · Vancouver, BC<\/span><span class=\"foot-note\">车主收入以实际匹配到的合作为准<\/span><\/footer><\/main>","driver":"<main class=\"shell info-page\"><a class=\"logo\" href=\"#home\" aria-label=\"Zumee\"><img class=\"logo-img\" src=\"__IMG_LOGO__\" alt=\"Zumee\"><\/a><div class=\"form-heading\"><p class=\"eyebrow\">车主登记<\/p><h1>你的车，也能帮你赚点钱。<\/h1><p>填几个信息，我们帮你的车找合适的广告。不用装任何定位软件，只要每周拍一张车的照片，月初月末各拍一张里程表就行。<\/p><\/div><section class=\"participation\" aria-label=\"如何参与\"><h2>怎么参与？就三步。<\/h2><ol><li><span class=\"step-number\">01<\/span><h3>登记你的车<\/h3><p>告诉我们你住哪个社区、车的品牌和年份、每个月大概开多少公里，再传一张车的照片。<\/p><\/li><li><span class=\"step-number\">02<\/span><h3>匹配广告<\/h3><p>有合适的广告我们会联系你，一起确认贴什么、贴多久、给多少钱。<\/p><\/li><li><span class=\"step-number\">03<\/span><h3>照常开车<\/h3><p>贴好广告，该怎么开还怎么开。每周拍一张车的照片，月初月末拍一下里程表，钱按月给你。<\/p><\/li><\/ol><\/section><form noValidate=\"\" class=\"form-card\" data-type=\"driver\"><label class=\"field\">你住哪个社区<input placeholder=\"例如：Kitsilano、列治文、本拿比\" required=\"\" maxLength=\"150\" class=\"w-full border border-input px-3 outline-none\" name=\"area\"/><\/label><div class=\"vehicle-fields\"><label class=\"field\">车的品牌<input placeholder=\"例如：丰田\" required=\"\" maxLength=\"80\" class=\"w-full border border-input px-3 outline-none\" name=\"brand\"/><\/label><label class=\"field\">车的年份<input type=\"number\" min=\"1990\" max=\"2027\" placeholder=\"例如：2020\" required=\"\" class=\"w-full border border-input px-3 outline-none\" name=\"year\"/><\/label><\/div><label class=\"field\">每个月大概开多少公里<input type=\"number\" min=\"0\" max=\"30000\" placeholder=\"例如：1200\" required=\"\" class=\"w-full border border-input px-3 outline-none\" name=\"mileage\"/><\/label><label class=\"field\">车的照片<input type=\"file\" accept=\"image/*\" required=\"\" class=\"w-full border border-input px-3 outline-none\" name=\"photo\"/><span class=\"hint\">拍一张能看到整个车身侧面的照片就行，10MB 以内。<\/span><\/label><label class=\"field\">联系电话<input type=\"tel\" autoComplete=\"tel\" placeholder=\"例如：604 123 4567\" required=\"\" minLength=\"7\" maxLength=\"30\" class=\"w-full border border-input px-3 outline-none\" name=\"phone\"/><\/label><div hidden=\"\" aria-hidden=\"true\"><input tabindex=\"-1\" autoComplete=\"off\" name=\"website\"/><\/div><button type=\"submit\" class=\"submit inline-flex items-center justify-center rounded-md bg-primary text-primary-foreground px-4 py-2\">提交登记 ↗<\/button><p class=\"fine\">点提交就表示你同意我们保存以上信息和照片，并就这次申请联系你。登记免费，但不保证一定能匹配到广告或有收入。<\/p><\/form><\/main>","business":"<main class=\"shell info-page\"><a class=\"logo\" href=\"#home\" aria-label=\"Zumee\"><img class=\"logo-img\" src=\"__IMG_LOGO__\" alt=\"Zumee\"><\/a><div class=\"form-heading\"><p class=\"eyebrow\">商家投放<\/p><h1>让更多本地人，看见你的生意。<\/h1><p>告诉我们你想推广什么，我们帮你找住在本地的车主，把你的广告贴上车、带上街。<\/p><\/div><section class=\"participation\" aria-label=\"如何参与\"><h2>怎么投放？就三步。<\/h2><ol><li><span class=\"step-number\">01<\/span><h3>说说你的需求<\/h3><p>想推广什么、店在哪儿、要几台车、投几个月，告诉我们就行。<\/p><\/li><li><span class=\"step-number\">02<\/span><h3>确认方案<\/h3><p>我们给你看车、看设计、报完整的价格，你觉得合适再定。<\/p><\/li><li><span class=\"step-number\">03<\/span><h3>广告上路<\/h3><p>付款后我们安排制作和安装。之后每周给你发实拍照片，每个月给你当月里程。<\/p><\/li><\/ol><\/section><form noValidate=\"\" class=\"form-card\" data-type=\"business\"><label class=\"field\">想推广什么<input placeholder=\"例如：Kitsilano 的咖啡店、房产经纪服务\" required=\"\" maxLength=\"200\" class=\"w-full border border-input px-3 outline-none\" name=\"product\"/><\/label><label class=\"field\">店铺地址（没有实体店可以不填）<input placeholder=\"例如：2100 W 4th Ave, Vancouver\" maxLength=\"200\" class=\"w-full border border-input px-3 outline-none\" name=\"address\"/><\/label><div class=\"vehicle-fields\"><label class=\"field\">需要几台车<input type=\"number\" min=\"1\" max=\"200\" placeholder=\"例如：3\" required=\"\" class=\"w-full border border-input px-3 outline-none\" name=\"vehicles\"/><\/label><label class=\"field\">想投几个月<input type=\"number\" min=\"1\" max=\"24\" placeholder=\"例如：3\" required=\"\" class=\"w-full border border-input px-3 outline-none\" name=\"months\"/><\/label><\/div><label class=\"field\">联系电话<input type=\"tel\" autoComplete=\"tel\" placeholder=\"例如：604 123 4567\" required=\"\" minLength=\"7\" maxLength=\"30\" class=\"w-full border border-input px-3 outline-none\" name=\"phone\"/><\/label><div hidden=\"\" aria-hidden=\"true\"><input tabindex=\"-1\" autoComplete=\"off\" name=\"website\"/><\/div><button type=\"submit\" class=\"submit inline-flex items-center justify-center rounded-md bg-primary text-primary-foreground px-4 py-2\">提交需求 ↗<\/button><p class=\"fine\">点提交就表示你同意我们保存以上信息，并就这次申请联系你。现在提交不用付款，方案和价格我们会跟你确认后再定。<\/p><\/form><\/main>","about":"<main class=\"shell info-page\"><a class=\"logo\" href=\"#home\" aria-label=\"Zumee\"><img class=\"logo-img\" src=\"__IMG_LOGO__\" alt=\"Zumee\"><\/a><section class=\"form-heading\"><h1>邻居的车，<br\/>帮本地生意打广告。<\/h1><p>Zumee 是一个大温本地的车身广告平台。一边是每天都在开车的车主，一边是想让更多人知道自己的本地商家，我们把两边对接起来。我们从温哥华起步，一个社区一个社区地做：车主住在这里，商家开在这里。车在街上跑，商家的名字就跟着进了街区、商场停车场和大家的日常生活。<\/p><\/section><section class=\"about-block\"><h2>车照常开，顺便赚点零花钱。<\/h2><p>上班、买菜、接送孩子，你该怎么开还怎么开。匹配到合适的广告后，车身就成了广告位，本来就要跑的路，顺便多赚一份。<\/p><p class=\"fine\">登记免费。能不能匹配到、贴什么、贴多久、给多少钱，都以双方确认的方案为准。我们不保证固定收入，也不需要你为了曝光多开车。<\/p><\/section><section class=\"about-block\"><h2>一天一杯咖啡的钱，让更多人看见你。<\/h2><p>我们想做到的，是让商家用一天一杯咖啡的预算，就能在本地多露脸。不管是推产品还是推店面，按你要几台车、投几个月提需求就行，剩下的交给我们。<\/p><p class=\"fine\">“一杯咖啡”说的是我们想做到的预算水平，不是定好的起步价或价格承诺。实际费用要看车辆、广告大小、制作安装和投放时长，以完整报价为准。我们也不保证具体的曝光次数、客流或销售额。<\/p><\/section><section class=\"about-block\"><h2>我们能保证什么，不能保证什么。<\/h2><p>我们不保证广告只在某个区域出现，也不追踪车主去了哪里。我们能保证的是：车主住在大温，商家是本地的生意，每周有实拍照片，每个月有里程记录。等数据积累够了，我们会推出可选的路线核验档，愿意分享路线的车主可以拿到更高的报酬。<\/p><\/section><\/main>","terms":"<main class=\"shell info-page\"><a class=\"logo\" href=\"#home\" aria-label=\"Zumee\"><img class=\"logo-img\" src=\"__IMG_LOGO__\" alt=\"Zumee\"><\/a><section class=\"form-heading\"><h1>合作条款（草案）<\/h1><p>以下是拟议合作原则，供司机和商家了解及讨论，目前不作为已生效的服务合同。正式合作前，我们会确认运营主体、报价、保险及具体责任，并通过单独的合作协议取得双方同意。提交登记不代表接受这些拟议条款。<\/p><\/section><div class=\"terms-list\"><section><h2>1. 登记与车辆匹配<\/h2><p>提交信息不构成接单、收入、车辆供应或广告上线承诺。我们可基于活动地区、车辆条件、广告类别及可用资源审核或拒绝申请。24小时回复为服务目标，不代表保证在24小时内完成匹配或启动投放。<\/p><\/section><section><h2>2. 司机资料与合法用车<\/h2><p>司机应提供真实资料，并在活动地区、车辆或联系方式变化时及时更新。合作前应具备合法驾驶资格、车辆使用及张贴广告的授权，并向保险方确认相应用途的保障要求。不得为了增加曝光而危险驾驶或违反交通规定。<\/p><\/section><section><h2>3. 司机报酬与展示义务<\/h2><p>报酬、展示位置、合作天数、核验方式及付款时间须在协议中写明。司机应按约保持广告完整、可见，并合理配合照片核验。中断展示或提前移除时，应及时通知；未履行部分可按约调整报酬，但已履行部分不应被无故扣除。任何额外核验或数据收集须事先说明。标准合作不要求安装定位软件，里程以里程表照片为准；自愿参加路线核验档的车主另行约定。<\/p><\/section><section><h2>4. 商家内容与知识产权<\/h2><p>商家应确保广告真实、合法，并有权使用所提供的商标、图片及文字。我们可拒绝或暂停涉嫌违法、侵权或不适宜的广告。商家仅就执行订单所需授予复制、制作及展示许可；公开案例展示需另行同意。因商家违约内容引发的第三方索赔，拟由商家承担依法认定、与其违约有因果关系的合理损失及处理费用，不含由我方自身过错造成的部分。<\/p><\/section><section><h2>5. 报价、付款与开始时间<\/h2><p>订单应列明币种、车辆数量、广告规格、投放期限、服务费、制作安装费用、适用税费及总价。确认方案与付款条件后方安排制作和投放；投放期从约定的实际展示日计算。“每天一杯咖啡”是预算目标，不是固定价格承诺。未付款可暂停后续服务；续期或额外费用需另行确认。<\/p><\/section><section><h2>6. 修改、取消与退款<\/h2><p>制作前可申请修改或取消。已获客户批准且实际发生、无法收回的制作或安装成本，以及已经履行的服务费用，可在法律允许及协议约定范围内扣除，并提供明细；其余未履行费用按约退还。若因我方原因无法提供服务，应协商替代安排，或退还无法履行部分的费用。法定取消和退款权利不受限制。<\/p><\/section><section><h2>7. 车贴安装、拆除与损伤<\/h2><p>安装前记录漆面状态，并确认材料、安装位置及拆除方式。旧漆、补漆、漆面老化或不当操作可能增加风险，不作“绝不伤车”的承诺。司机发现异常应及时停止不当操作、保留照片并联系我方。责任根据证据、原因、适用法律及协议确定；不因使用第三方安装人员而一概排除我方应承担的责任。<\/p><\/section><section><h2>8. 投放效果与中断<\/h2><p>除协议明确约定可核验的指标外，不保证曝光量、点击、客流、询盘或销售结果。车辆维修、天气或其他中断应及时沟通；可按协议安排相当条件的替代车辆、延长投放或相应费用调整。重大变化需客户确认，不能以此免除未提供服务的退款义务。<\/p><\/section><section><h2>9. 个人信息与联系<\/h2><p>登记资料拟用于联系、车辆匹配和订单管理。仅向履行服务所需的人员或服务商提供必要信息；向商家公开司机联系方式、用于额外营销或其他目的前，应另行告知并取得适当同意。正式上线前将补充隐私负责人、联系渠道、保存期限及查阅、更正和删除请求流程。<\/p><\/section><section><h2>10. 责任范围与争议处理<\/h2><p>拟议合作协议可在法律允许范围内，将与订单有关的一般合同索赔责任上限设为争议订单已支付的服务费，并排除依法可排除的间接损失；须结合保险和实际业务由律师审阅。不排除欺诈、重大过失、人身伤害或法律不得排除的责任及法定权利。争议可先协商，保留依法寻求救济的权利；原则上适用不列颠哥伦比亚省及加拿大适用法律。条款变更不追溯修改已确认订单，重大变更应取得双方同意。<\/p><\/section><\/div><p class=\"draft-note\">这是供完善的条款草案。正式收款与开展合作前，应由不列颠哥伦比亚省律师审阅并形成适合实际业务的协议。<\/p><\/main>","pay":"<main class=\"shell info-page\"><a class=\"logo\" href=\"#home\" aria-label=\"Zumee\"><img class=\"logo-img\" src=\"__IMG_LOGO__\" alt=\"Zumee\"><\/a><section class=\"form-heading\"><h1>商家付款<\/h1><p>在线付款还在准备中。方案确认后，我们会跟你约定付款方式。<\/p><\/section><\/main>"},"en":{"home":"<main class=\"home\"><header class=\"nav\"><a class=\"logo\" href=\"#home\" aria-label=\"Zumee\"><img class=\"logo-img\" src=\"__IMG_LOGO__\" alt=\"Zumee\"><\/a><span class=\"nav-note\">Vancouver · Vehicle advertising<\/span><a class=\"nav-link\" href=\"#pay\">Brand payments<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-arrow-up-right\" aria-hidden=\"true\"><path d=\"M7 7h10v10\"><\/path><path d=\"M7 17 17 7\"><\/path><\/svg><\/a><\/header><section class=\"intro\"><p class=\"eyebrow\">YOUR CITY. YOUR NEXT OPPORTUNITY.<\/p><h1>Make every mile <span>count.<\/span><\/h1><p>Local drivers. Local businesses.<\/p><\/section><section class=\"split\"><a class=\"portal driver\" href=\"#driver\"><div class=\"portal-top\"><span>01 / FOR DRIVERS<\/span><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-move-up-right\" aria-hidden=\"true\"><path d=\"M13 5H19V11\"><\/path><path d=\"M19 5L5 19\"><\/path><\/svg><\/div><div class=\"portal-body\"><p class=\"kicker\">FOR DRIVERS<\/p><h2>Drive as usual.<br/>Earn on the way<span>.<\/span><\/h2><p class=\"description\">Drive as usual, help a local shop get noticed, earn on the way.<br/>One photo a week. No tracking apps.<\/p><span class=\"cta\">Register my car<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-arrow-up-right\" aria-hidden=\"true\"><path d=\"M7 7h10v10\"><\/path><path d=\"M7 17 17 7\"><\/path><\/svg><\/span><\/div><div class=\"portal-bottom\"><span>Your route · Your routine<\/span><span>Free registration<\/span><\/div><\/a><a class=\"portal business\" href=\"#business\"><div class=\"portal-top\"><span>02 / FOR BRANDS<\/span><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-move-up-right\" aria-hidden=\"true\"><path d=\"M13 5H19V11\"><\/path><path d=\"M19 5L5 19\"><\/path><\/svg><\/div><div class=\"portal-body\"><p class=\"kicker\">FOR BRANDS<\/p><h2>Take your brand out.<br/>Get seen more<span>.<\/span><\/h2><p class=\"description\">Your ad rides with neighbours who drive all over Metro Vancouver.<br/>Get a real street photo every week and see your name out there.<\/p><span class=\"cta\">Start advertising<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-arrow-up-right\" aria-hidden=\"true\"><path d=\"M7 7h10v10\"><\/path><path d=\"M7 17 17 7\"><\/path><\/svg><\/span><\/div><div class=\"portal-bottom\"><span>Multiple cars · Monthly campaigns<\/span><span>Contact within 24 hours<\/span><\/div><\/a><\/section><section class=\"why\"><div class=\"showcase-heading\"><div><p class=\"eyebrow\">Why local<\/p><h2>Neighbours helping neighbours.<\/h2><\/div><p>Local drivers. City-wide reach.<\/p><\/div><div class=\"why-grid\"><div><h3>Drivers are neighbours<\/h3><p>Every car belongs to someone who lives in Metro Vancouver and tells us their neighbourhood when they sign up. No outsourced fleets.<\/p><\/div><div><h3>Money stays local<\/h3><p>Most of what a business pays goes straight to a local driver, not to a big company.<\/p><\/div><div><h3>Proof you can see<\/h3><p>Drivers send a time-stamped photo of the car every week and odometer photos at the start and end of each month, so you can see the car is really on the road.<\/p><\/div><\/div><\/section><section class=\"showcase\"><div class=\"showcase-heading\"><div><p class=\"eyebrow\">On the road<\/p><h2>Part of the city. Worth a second look.<\/h2><\/div><p>A moving ad that fits into everyday life.<\/p><\/div><div class=\"carousel\" data-carousel><div class=\"track\"><figure class=\"slide\"><img src=\"/images/showcase-1.webp\" alt=\"Real estate agent\" loading=\"lazy\"/><figcaption><span>01<\/span>Real estate agent<\/figcaption><\/figure><figure class=\"slide\"><img src=\"/images/showcase-2.webp\" alt=\"Dental clinic\" loading=\"lazy\"/><figcaption><span>02<\/span>Dental clinic<\/figcaption><\/figure><figure class=\"slide\"><img src=\"/images/showcase-3.webp\" alt=\"Bakery\" loading=\"lazy\"/><figcaption><span>03<\/span>Bakery<\/figcaption><\/figure><figure class=\"slide\"><img src=\"/images/showcase-4.webp\" alt=\"Florist\" loading=\"lazy\"/><figcaption><span>04<\/span>Florist<\/figcaption><\/figure><figure class=\"slide\"><img src=\"/images/showcase-5.webp\" alt=\"Grocery market\" loading=\"lazy\"/><figcaption><span>05<\/span>Grocery market<\/figcaption><\/figure><figure class=\"slide\"><img src=\"/images/showcase-6.webp\" alt=\"Flooring & home improvement\" loading=\"lazy\"/><figcaption><span>06<\/span>Flooring & home improvement<\/figcaption><\/figure><\/div><button type=\"button\" class=\"car-btn prev\" aria-label=\"Previous\">‹<\/button><button type=\"button\" class=\"car-btn next\" aria-label=\"Next\">›<\/button><div class=\"dots\"><button type=\"button\" class=\"dot\" data-i=\"0\" aria-label=\"1\"><\/button><button type=\"button\" class=\"dot\" data-i=\"1\" aria-label=\"2\"><\/button><button type=\"button\" class=\"dot\" data-i=\"2\" aria-label=\"3\"><\/button><button type=\"button\" class=\"dot\" data-i=\"3\" aria-label=\"4\"><\/button><button type=\"button\" class=\"dot\" data-i=\"4\" aria-label=\"5\"><\/button><button type=\"button\" class=\"dot\" data-i=\"5\" aria-label=\"6\"><\/button><\/div><\/div><p class=\"fine\">Concept renderings only. Actual size, artwork and placement depend on the agreed plan and may differ from what is shown.<\/p><\/section><footer><span>© 2026 Zumee · Vancouver, BC<\/span><span class=\"foot-note\">Driver earnings depend on matching and agreed campaigns<\/span><\/footer><\/main>","driver":"<main class=\"shell info-page\"><a class=\"logo\" href=\"#home\" aria-label=\"Zumee\"><img class=\"logo-img\" src=\"__IMG_LOGO__\" alt=\"Zumee\"><\/a><div class=\"form-heading\"><p class=\"eyebrow\">FOR DRIVERS / REGISTRATION<\/p><h1>Your next drive. More possibilities.<\/h1><p>Leave a few details so we can match your car with the right campaign. No tracking app required: verification is one photo a week and two odometer photos a month.<\/p><\/div><section class=\"participation\" aria-label=\"How it works\"><h2>Three steps to get started.<\/h2><ol><li><span class=\"step-number\">01<\/span><h3>Register your car<\/h3><p>Share your neighbourhood, car details, monthly mileage and one photo.<\/p><\/li><li><span class=\"step-number\">02<\/span><h3>Match a campaign<\/h3><p>Agree on the campaign, pay and display requirements.<\/p><\/li><li><span class=\"step-number\">03<\/span><h3>Drive as usual<\/h3><p>Keep driving your normal routes. Send one photo of the car each week and odometer photos at the start and end of the month. Get paid monthly.<\/p><\/li><\/ol><\/section><form noValidate=\"\" class=\"form-card\" data-type=\"driver\"><label class=\"field\">Your neighbourhood<input placeholder=\"e.g. Kitsilano, Richmond, Burnaby\" required=\"\" maxLength=\"150\" class=\"w-full border border-input px-3 outline-none\" name=\"area\"/><\/label><div class=\"vehicle-fields\"><label class=\"field\">Vehicle make<input placeholder=\"e.g. Toyota\" required=\"\" maxLength=\"80\" class=\"w-full border border-input px-3 outline-none\" name=\"brand\"/><\/label><label class=\"field\">Vehicle year<input type=\"number\" min=\"1990\" max=\"2027\" placeholder=\"e.g. 2020\" required=\"\" class=\"w-full border border-input px-3 outline-none\" name=\"year\"/><\/label><\/div><label class=\"field\">Monthly mileage (km)<input type=\"number\" min=\"0\" max=\"30000\" placeholder=\"e.g. 1200\" required=\"\" class=\"w-full border border-input px-3 outline-none\" name=\"mileage\"/><\/label><label class=\"field\">Vehicle photo<input type=\"file\" accept=\"image/*\" required=\"\" class=\"w-full border border-input px-3 outline-none\" name=\"photo\"/><span class=\"hint\">One photo showing the whole side of the car, under 10 MB.<\/span><\/label><label class=\"field\">Phone number<input type=\"tel\" autoComplete=\"tel\" placeholder=\"e.g. 604 123 4567\" required=\"\" minLength=\"7\" maxLength=\"30\" class=\"w-full border border-input px-3 outline-none\" name=\"phone\"/><\/label><div hidden=\"\" aria-hidden=\"true\"><input tabindex=\"-1\" autoComplete=\"off\" name=\"website\"/><\/div><button type=\"submit\" class=\"submit inline-flex items-center justify-center rounded-md bg-primary text-primary-foreground px-4 py-2\">Submit registration ↗<\/button><p class=\"fine\">By submitting, you agree that we may store these details and your photo and contact you about this application. Registration does not guarantee campaigns or earnings.<\/p><\/form><\/main>","business":"<main class=\"shell info-page\"><a class=\"logo\" href=\"#home\" aria-label=\"Zumee\"><img class=\"logo-img\" src=\"__IMG_LOGO__\" alt=\"Zumee\"><\/a><div class=\"form-heading\"><p class=\"eyebrow\">FOR BRANDS / ADVERTISING<\/p><h1>Your brand deserves to be seen.<\/h1><p>Tell us what you need and let drivers who live nearby carry your name through the city.<\/p><\/div><section class=\"participation\" aria-label=\"How it works\"><h2>Three steps to get started.<\/h2><ol><li><span class=\"step-number\">01<\/span><h3>Tell us your needs<\/h3><p>Share your business, address, vehicle count and duration.<\/p><\/li><li><span class=\"step-number\">02<\/span><h3>Confirm the plan<\/h3><p>Approve vehicles, artwork and the full quote.<\/p><\/li><li><span class=\"step-number\">03<\/span><h3>Launch your campaign<\/h3><p>Pay and arrange installation, then receive weekly street photos and monthly mileage.<\/p><\/li><\/ol><\/section><form noValidate=\"\" class=\"form-card\" data-type=\"business\"><label class=\"field\">Product or business to advertise<input placeholder=\"e.g. a coffee shop in Kitsilano, real estate services\" required=\"\" maxLength=\"200\" class=\"w-full border border-input px-3 outline-none\" name=\"product\"/><\/label><label class=\"field\">Business address (if applicable)<input placeholder=\"e.g. 2100 W 4th Ave, Vancouver\" maxLength=\"200\" class=\"w-full border border-input px-3 outline-none\" name=\"address\"/><\/label><div class=\"vehicle-fields\"><label class=\"field\">Number of vehicles<input type=\"number\" min=\"1\" max=\"200\" placeholder=\"e.g. 3\" required=\"\" class=\"w-full border border-input px-3 outline-none\" name=\"vehicles\"/><\/label><label class=\"field\">Campaign duration (months)<input type=\"number\" min=\"1\" max=\"24\" placeholder=\"e.g. 3\" required=\"\" class=\"w-full border border-input px-3 outline-none\" name=\"months\"/><\/label><\/div><label class=\"field\">Phone number<input type=\"tel\" autoComplete=\"tel\" placeholder=\"e.g. 604 123 4567\" required=\"\" minLength=\"7\" maxLength=\"30\" class=\"w-full border border-input px-3 outline-none\" name=\"phone\"/><\/label><div hidden=\"\" aria-hidden=\"true\"><input tabindex=\"-1\" autoComplete=\"off\" name=\"website\"/><\/div><button type=\"submit\" class=\"submit inline-flex items-center justify-center rounded-md bg-primary text-primary-foreground px-4 py-2\">Submit campaign request ↗<\/button><p class=\"fine\">By submitting, you agree that we may store these details and contact you about this application. No payment is required to apply. Our team will confirm your campaign and pricing.<\/p><\/form><\/main>","about":"<main class=\"shell info-page\"><a class=\"logo\" href=\"#home\" aria-label=\"Zumee\"><img class=\"logo-img\" src=\"__IMG_LOGO__\" alt=\"Zumee\"><\/a><section class=\"form-heading\"><h1>Everyday journeys. More opportunities to be seen.<\/h1><p>Zumee is a vehicle advertising platform for Metro Vancouver, connecting everyday drivers with businesses seeking more local visibility. We started in Vancouver and grow one neighbourhood at a time: drivers live here, businesses are based here. We turn space on cars into moving advertisements, bringing brands into neighbourhoods, shopping districts and daily life.<\/p><\/section><section class=\"about-block\"><h2>Drive as usual. Explore passive income.<\/h2><p>Commute, shop and run your errands on your usual routes. Once matched with a suitable campaign, earn extra income by displaying a brand on your car and add value to journeys you already make.<\/p><p class=\"fine\">Registration is free. Matching, display requirements, campaign duration and compensation depend on the agreed campaign. No fixed income is guaranteed, and extra driving for exposure is not required.<\/p><\/section><section class=\"about-block\"><h2>A daily coffee budget. More chances to be seen.<\/h2><p>Our goal is to help businesses pursue greater local visibility on a daily coffee budget. Promote a product or your storefront by requesting the number of vehicles and campaign months you need, bringing your brand into potential customers’ everyday lives.<\/p><p class=\"fine\">“A daily coffee” describes our affordability goal, not an established starting price or price promise. Actual fees depend on vehicles, ad specifications, production, installation and campaign duration, as set out in a complete quote. No specific impressions, foot traffic or sales are guaranteed.<\/p><\/section><section class=\"about-block\"><h2>What we promise, and what we don’t.<\/h2><p>We don’t promise that your ad stays inside one area, and we don’t track where drivers go. What we do promise: drivers live in Metro Vancouver, businesses are local, there is a real photo every week and a mileage record every month. Once we have enough data we will add an optional verified-route tier, with higher pay for drivers who choose to share their routes.<\/p><\/section><\/main>","terms":"<main class=\"shell info-page\"><a class=\"logo\" href=\"#home\" aria-label=\"Zumee\"><img class=\"logo-img\" src=\"__IMG_LOGO__\" alt=\"Zumee\"><\/a><section class=\"form-heading\"><h1>Proposed partnership terms<\/h1><p>These proposed principles are for drivers and brands to review and discuss. They are not an effective service contract. Before a campaign begins, the operating entity, quote, insurance and responsibilities will be confirmed in a separate agreement accepted by both parties. Registration does not mean acceptance of these proposed terms.<\/p><\/section><div class=\"terms-list\"><section><h2>1. Registration and matching<\/h2><p>Submitting details does not guarantee acceptance, earnings, vehicle availability or a campaign launch. Applications may be reviewed or declined based on location, vehicle condition, advertising category and capacity. A response within 24 hours is a service target, not a guarantee of matching or launch within that time.<\/p><\/section><section><h2>2. Driver information and lawful vehicle use<\/h2><p>Drivers must provide accurate information and promptly report changes to driving areas, vehicles or contact details. Before a campaign, drivers must hold the required driving licence and permission to use the vehicle and display advertising, and confirm relevant coverage requirements with their insurer. Exposure must never be pursued through unsafe driving or traffic violations.<\/p><\/section><section><h2>3. Driver payment and display obligations<\/h2><p>Compensation, placement, campaign days, verification and payment timing must be specified in the agreement. Drivers should keep the advertisement intact and visible as agreed and reasonably assist with photo verification. Interruptions or early removal must be reported promptly. Compensation for unfulfilled service may be adjusted as agreed, without unjustified withholding for completed service. Additional verification or data collection must be explained in advance. Standard campaigns do not require a location-tracking app; mileage is based on odometer photos. Drivers who opt into a verified-route tier agree to separate terms.<\/p><\/section><section><h2>4. Brand content and intellectual property<\/h2><p>Brands must provide truthful, lawful advertising and hold the rights to supplied logos, images and text. We may reject or suspend content suspected of being unlawful, infringing or unsuitable. Permission to reproduce, produce and display materials is limited to fulfilling the order; public case studies require separate consent. Proposed indemnity obligations cover legally established, reasonable third-party losses and handling costs caused by the brand’s breach, excluding losses caused by our own fault.<\/p><\/section><section><h2>5. Quotes, payment and start dates<\/h2><p>Orders must specify currency, vehicle count, ad specifications, duration, service fees, production and installation costs, applicable taxes and the total price. Production and placement follow confirmation of the plan and payment terms. Campaign duration begins on the agreed actual display date. “A daily coffee” is a budget goal, not a fixed price promise. Non-payment may pause future service; renewals or additional charges require separate confirmation.<\/p><\/section><section><h2>6. Changes, cancellation and refunds<\/h2><p>Changes or cancellation may be requested before production. Approved, actually incurred and unrecoverable production or installation costs, plus completed services, may be deducted where lawful and agreed, with an itemized explanation. Remaining fees for unperformed services are refundable as agreed. If we cannot provide the service, we will agree on an alternative or refund the unfulfilled portion. Statutory cancellation and refund rights remain unaffected.<\/p><\/section><section><h2>7. Installation, removal and vehicle damage<\/h2><p>Paint condition must be documented before installation, with materials, placement and removal methods agreed. Older or repainted surfaces, deteriorating paint and improper handling can increase risk; no absolute damage-free promise is made. Drivers should promptly stop improper handling, preserve photographs and contact us if an issue arises. Responsibility depends on evidence, causation, applicable law and the agreement. Using an outside installer does not automatically exclude responsibilities we legally bear.<\/p><\/section><section><h2>8. Results and campaign interruptions<\/h2><p>Unless an agreement expressly specifies verifiable metrics, no impressions, clicks, visits, leads or sales are guaranteed. Repairs, weather and other interruptions should be communicated promptly. Comparable replacement vehicles, extensions or fee adjustments may be arranged under the agreement. Material changes require customer confirmation and do not remove refund obligations for services not provided.<\/p><\/section><section><h2>9. Personal information and contact<\/h2><p>Registration details are intended for contact, matching and order management. Necessary information is shared only with personnel or providers needed to deliver the service. Disclosure of a driver’s contact details to a brand, additional marketing or other purposes requires appropriate notice and consent. A privacy contact, retention periods and procedures for access, correction and deletion requests will be added before commercial launch.<\/p><\/section><section><h2>10. Liability and disputes<\/h2><p>Subject to applicable law, a proposed agreement may cap ordinary order-related contractual claims at the service fees paid for the disputed order and exclude indirect losses that may lawfully be excluded. A lawyer must review these provisions against the actual business and insurance arrangements. Fraud, gross negligence, personal injury, non-excludable liability and statutory rights are not excluded. Parties may first seek a negotiated resolution while retaining lawful remedies. British Columbia and applicable Canadian law would generally apply. Changes do not retroactively alter confirmed orders; material changes require mutual agreement.<\/p><\/section><\/div><p class=\"draft-note\">These terms are a working draft. A British Columbia lawyer should review them and prepare agreements suited to the actual business before payments are accepted or campaigns begin.<\/p><\/main>","pay":"<main class=\"shell info-page\"><a class=\"logo\" href=\"#home\" aria-label=\"Zumee\"><img class=\"logo-img\" src=\"__IMG_LOGO__\" alt=\"Zumee\"><\/a><section class=\"form-heading\"><h1>Brand payments<\/h1><p>This is a demo. Payments are not accepted.<\/p><\/section><\/main>"}};

app.addEventListener("submit",async e=>{e.preventDefault();const form=e.target;if(!form.checkValidity()){form.reportValidity();return}
const file=form.querySelector('input[type=file]');if(file&&file.files[0]&&file.files[0].size>10*1024*1024){alert(lang==="zh"?"照片超过 10MB，请换一张。":"Photo is larger than 10 MB, please choose another.");return}
const btn=form.querySelector('button[type=submit]');const orig=btn.textContent;btn.disabled=true;btn.textContent=lang==="zh"?"提交中…":"Submitting…";
const data={type:form.dataset.type||"unknown",lang,submittedAt:new Date().toISOString(),page:location.hash,ua:navigator.userAgent};
for(const el of form.querySelectorAll("input")){if(el.type==="file"||!el.name)continue;data[el.name]=el.value.trim()}
if(data.website){notice("ok");return}
try{if(file&&file.files[0]){const f=file.files[0];data.photoName=f.name;try{data.photo=await resizeImage(f,1400,0.82)}catch(_){data.photo=await readAsDataURL(f)}}
if(!FORM_ENDPOINT)throw new Error("no endpoint");
const r=await fetch(FORM_ENDPOINT,{method:"POST",body:JSON.stringify(data)});let j=null;try{j=await r.json()}catch(_){}
if(!(r.ok&&(!j||j.ok!==false)))throw new Error("bad response");notice("ok")}catch(err){btn.disabled=false;btn.textContent=orig;notice("err")}});
function initCarousel(){const c=app.querySelector("[data-carousel]");if(!c)return;const track=c.querySelector(".track"),slides=[...c.querySelectorAll(".slide")],dots=[...c.querySelectorAll(".dot")];let idx=0,timer2=null,paused=false;
const go=i=>{idx=(i+slides.length)%slides.length;track.scrollTo({left:slides[idx].offsetLeft-track.offsetLeft,behavior:"smooth"});dots.forEach((d,k)=>d.classList.toggle("active",k===idx))};
c.querySelector(".prev").addEventListener("click",()=>{go(idx-1);rest()});c.querySelector(".next").addEventListener("click",()=>{go(idx+1);rest()});dots.forEach(d=>d.addEventListener("click",()=>{go(+d.dataset.i);rest()}));
track.addEventListener("scroll",()=>{const x=track.scrollLeft;let best=0,bd=1e9;slides.forEach((s,k)=>{const d=Math.abs(s.offsetLeft-track.offsetLeft-x);if(d<bd){bd=d;best=k}});idx=best;dots.forEach((d,k)=>d.classList.toggle("active",k===idx))},{passive:true});
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function start(){if(reduce)return;stop();timer2=setInterval(()=>{if(!paused&&document.visibilityState==="visible")go(idx+1)},5000)}function stop(){if(timer2)clearInterval(timer2)}function rest(){stop();setTimeout(start,9000)}
c.addEventListener("pointerenter",()=>paused=true);c.addEventListener("pointerleave",()=>paused=false);c.addEventListener("touchstart",()=>{paused=true},{passive:true});c.addEventListener("touchend",()=>{setTimeout(()=>paused=false,6000)},{passive:true});
dots[0]&&dots[0].classList.add("active");start();window.addEventListener("hashchange",stop,{once:true})}
window.addEventListener("hashchange",render);render();
</script>
</body></html>
